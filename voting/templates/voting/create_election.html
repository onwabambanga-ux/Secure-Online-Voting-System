<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Election</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #1f2937;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 24px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .back-link {
            background: #444;
        }

        .back-link:hover {
            background: #666;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .section-title {
            margin-top: 35px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e5e7eb;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* Candidate section */

        .candidate-card {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            background: #f9fafb;
        }

        .candidate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .candidate-header h4 {
            color: #172554;
            font-size: 17px;
        }

        .remove-button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-button:hover {
            background: #b91c1c;
        }

        .add-candidate-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        .add-candidate-button:hover {
            background: #1d4ed8;
        }

        .image-help {
            color: #6b7280;
            font-size: 13px;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .submit-button {
            background: #16a34a;
            color: white;
        }

        .submit-button:hover {
            background: #15803d;
        }

        .cancel-button {
            background: #6b7280;
            color: white;
        }

        .cancel-button:hover {
            background: #4b5563;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 20px;
                flex-direction: column;
                gap: 10px;
            }

            .container {
                padding: 20px;
            }

            .candidate-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>🗳️ Secure Online Voting System</h1>

        <div class="navbar-right">
            <a href="{% url 'manage_elections' %}" class="back-link">
                ← Back to Elections
            </a>

            <a href="{% url 'admin_dashboard' %}" class="back-link">
                Admin Dashboard
            </a>
        </div>
    </div>

    <div class="container">

        <div class="form-card">

            <h2>Create Election</h2>

            <p class="subtitle">
                Create a new election and add its candidates.
            </p>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <!-- ========================= -->
                <!-- ELECTION DETAILS -->
                <!-- ========================= -->

                <h3 class="section-title">Election Details</h3>

                <div class="form-group">
                    <label for="title">Election Title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter election title"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Enter election description"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="election_type">Election Type</label>

                    <select
                        id="election_type"
                        name="election_type"
                        required
                    >
                        <option value="NORMAL">
                            Normal Election
                        </option>

                        <option value="RUNOFF">
                            Runoff
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="campus">Campus (optional)</label>

                    <input
                        type="text"
                        id="campus"
                        name="campus"
                        placeholder="Enter campus name"
                    >
                </div>

                <div class="form-group">
                    <label for="start_date">
                        Start Date and Time
                    </label>

                    <input
                        type="datetime-local"
                        id="start_date"
                        name="start_date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="end_date">
                        End Date and Time
                    </label>

                    <input
                        type="datetime-local"
                        id="end_date"
                        name="end_date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="status">Election Status</label>

                    <select
                        id="status"
                        name="status"
                        required
                    >
                        <option value="DRAFT">Draft</option>
                        <option value="SCHEDULED">Scheduled</option>
                        <option value="OPEN">Open</option>
                        <option value="CLOSED">Closed</option>
                        <option value="RESULTS">Results</option>
                    </select>
                </div>


                <!-- ========================= -->
                <!-- CANDIDATES -->
                <!-- ========================= -->

                <h3 class="section-title">Candidates</h3>

                <p class="subtitle">
                    Add the organizations or independent candidates
                    participating in this election.
                </p>

                <div id="candidates-container">

                    <!-- Candidate cards will be added here -->

                </div>

                <input
                    type="hidden"
                    id="candidate_count"
                    name="candidate_count"
                    value="0"
                >

                <button
                    type="button"
                    class="add-candidate-button"
                    onclick="addCandidate()"
                >
                    + Add Candidate
                </button>


                <!-- ========================= -->
                <!-- FORM BUTTONS -->
                <!-- ========================= -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="button submit-button"
                    >
                        Create Election
                    </button>

                    <a
                        href="{% url 'manage_elections' %}"
                        class="button cancel-button"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>


    <!-- ========================= -->
    <!-- CANDIDATE JAVASCRIPT -->
    <!-- ========================= -->

    <script>

    let candidateCount = 0;

    function addCandidate() {

        const container =
            document.getElementById('candidates-container');

        const candidateNumber = candidateCount;

        const candidateCard =
            document.createElement('div');

        candidateCard.className = 'candidate-card';

        candidateCard.id =
            `candidate-${candidateNumber}`;

        candidateCard.innerHTML = `

            <div class="candidate-header">

                <h4>
                    Candidate ${candidateNumber + 1}
                </h4>

                <button
                    type="button"
                    class="remove-button"
                    onclick="removeCandidate(${candidateNumber})"
                >
                    Remove
                </button>

            </div>

            <!-- SRC CATEGORY -->

            <div class="form-group">

                <label>
                    SRC Category
                </label>

                <select
                    name="candidate_src_category_${candidateNumber}"
                    required
                    onchange="toggleCandidateCampus(${candidateNumber}, this.value)"
                >

                    <option value="INSTITUTIONAL">
                        Institutional SRC
                    </option>

                    <option value="CAMPUS">
                        Campus SRC
                    </option>

                </select>

            </div>

            <!-- CANDIDATE CAMPUS -->

            <div
                class="form-group"
                id="candidate-campus-group-${candidateNumber}"
                style="display: none;"
            >
                <label>
                    Campus
                </label>

                <select
                    name="candidate_campus_${candidateNumber}"
                    id="candidate-campus-${candidateNumber}"
                >
                    <option value="" disabled selected>Select Campus</option>
                    <option value="Alice Campus">Alice Campus</option>
                    <option value="East London Campus">East London Campus</option>
                </select>
            </div>


            <!-- CANDIDATE TYPE -->

            <div class="form-group">

                <label>
                    Candidate Type
                </label>

                <select
                    name="candidate_type_${candidateNumber}"
                    required
                >

                    <option value="ORGANIZATION">
                        Organization
                    </option>

                    <option value="INDEPENDENT">
                        Independent Candidate
                    </option>

                </select>

            </div>


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Candidate / Organization Name
                </label>

                <input
                    type="text"
                    name="candidate_name_${candidateNumber}"
                    placeholder="Enter candidate or organization name"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    name="candidate_description_${candidateNumber}"
                    placeholder="Enter a short description"
                ></textarea>

            </div>


            <!-- IMAGE -->

            <div class="form-group">

                <label>
                    Logo / Candidate Photo
                </label>

                <input
                    type="file"
                    name="candidate_image_${candidateNumber}"
                    accept="image/*"
                >

                <p class="image-help">
                    Upload an organization logo or candidate photo.
                </p>

            </div>

        `;

        container.appendChild(candidateCard);

        candidateCount++;

        updateCandidateCount();
    }


    function toggleCandidateCampus(number, category) {

        const campusGroup = document.getElementById(
            `candidate-campus-group-${number}`
        );

        const campusInput = document.getElementById(
            `candidate-campus-${number}`
        );

        if (category === 'CAMPUS') {

            campusGroup.style.display = 'block';
            campusInput.required = true;

        } else {

            campusGroup.style.display = 'none';
            campusInput.required = false;
            campusInput.value = '';

        }
    }


    function removeCandidate(number) {

        const candidate =
            document.getElementById(
                `candidate-${number}`
            );

        if (candidate) {
            candidate.remove();
        }

        updateCandidateCount();
    }


    function updateCandidateCount() {

        const candidates =
            document.querySelectorAll(
                '#candidates-container .candidate-card'
            );

        document.getElementById(
            'candidate_count'
        ).value = candidates.length;
    }


    // Start with one candidate automatically
    addCandidate();

    // The first candidate defaults to Institutional SRC,
    // so its campus field remains hidden.


</script>

</body>
</html>
