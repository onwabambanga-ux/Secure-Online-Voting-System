<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% load static %}

  <link rel="stylesheet" href="{% static 'voting/css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'voting/css/style.css' %}">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Login page layout */
    body.login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    body.login-page .auth-shell {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    body.login-page .auth-card {
      width: 100%;
      max-width: 520px;
      min-height: auto;
      margin: 0 auto;
      padding: 42px;
      box-sizing: border-box;
    }

    @media (max-width: 600px) {
      body.login-page {
        padding: 20px 15px;
      }

      body.login-page .auth-card {
        padding: 30px 22px;
      }
    }
  </style>

  <title>Login | Secure Online Voting System</title>
</head>


<body class="login-page auth-background">

  <main class="auth-shell">

    <section class="auth-card" aria-labelledby="login-title">

      <!-- Logo -->
      <div class="logo" aria-hidden="true">
        <svg
          class="logo-icon"
          viewBox="0 0 48 48"
          role="img"
          focusable="false"
        >
          <rect
            x="10"
            y="6"
            width="28"
            height="36"
            rx="4"
          ></rect>

          <path d="M16 14h16M16 21h16M16 28h8"></path>

          <path d="m28 30 3 3 6-7"></path>
        </svg>
      </div>


      <!-- Heading -->
      <h1 id="login-title">
        Welcome Back
      </h1>

      <p class="subtitle">
        Login to your voting account
      </p>


      <!-- Error Message -->
      {% if error %}
      <div class="error" role="alert">
        {{ error }}
      </div>
      {% endif %}


      <!-- Login Form -->
      <form method="POST">

        {% csrf_token %}


        <!-- Username -->
        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        >


        <!-- Password -->
        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >


        <!-- Login -->
        <button type="submit">
          Login
        </button>


        <!-- Forgot Password -->
        <p>
          <a href="{% url 'password_reset' %}">
            Forgot your password?
          </a>
        </p>

      </form>


      <!-- Register -->
      <p class="register-link">

        Don't have an account?

        <a href="{% url 'register' %}">
          Register
        </a>

      </p>

    </section>

  </main>


  <!-- Theme JavaScript -->
  <script src="{% static 'voting/js/auth_sidebar.js' %}"></script>

</body>

</html>
