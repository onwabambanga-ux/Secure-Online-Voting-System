<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="stylesheet" href="{% static 'voting/css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'voting/css/style.css' %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body.auth-background {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    body.auth-background .auth-shell {
      width: min(100%, 520px);
      margin: 0 auto;
    }

    body.auth-background .auth-card {
      width: 100%;
      min-height: auto;
      margin: 0;
      padding: 42px;
    }

    @media (max-width: 600px) {
      body.auth-background {
        padding: 15px;
      }

      body.auth-background .auth-card {
        padding: 28px 20px;
      }
    }
  </style>
  <title>Login | Online Voting System</title>
</head>

<body class="auth-background">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="logo" aria-hidden="true">
        <svg class="logo-icon" viewBox="0 0 48 48" role="img" focusable="false">
          <rect x="10" y="6" width="28" height="36" rx="4"></rect>
          <path d="M16 14h16M16 21h16M16 28h8"></path>
          <path d="m28 30 3 3 6-7"></path>
        </svg>
      </div>

      <h1 id="login-title">Welcome Back</h1>

      <p class="subtitle">
        Login to your voting account
      </p>

      {% if error %}
      <div class="error" role="alert">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <label for="username">
          Username
        </label>

        <input type="text" id="username" name="username" placeholder="Enter your username" required>

        <label for="password">
          Password
        </label>

        <input type="password" id="password" name="password" placeholder="Enter your password" required>

        <button type="submit">
          Login
        </button>
      </form>

      <p class="register-link">
        Don't have an account?
        <a href="{% url 'register' %}">
          Register
        </a>
      </p>
    </section>
  </main>
</body>

</html>
