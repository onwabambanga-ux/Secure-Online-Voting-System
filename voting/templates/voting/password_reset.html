<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}

    <link rel="stylesheet" href="{% static 'voting/css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'voting/css/style.css' %}">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html,
        body {
            min-height: 100%;
        }

        body.password-reset-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
            overflow-x: hidden;
            background-color: var(--color-bg);
            background-attachment: fixed;
        }

        body.password-reset-page .auth-shell {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        body.password-reset-page .auth-card {
            width: 100%;
            max-width: 520px;
            min-height: auto;
            margin: 0 auto;
            padding: 42px;
            box-sizing: border-box;
        }

        @media (max-width: 600px) {
            body.password-reset-page {
                padding: 20px 15px;
            }

            body.password-reset-page .auth-card {
                padding: 30px 22px;
            }
        }
    </style>

    <title>Forgot Password | Secure Online Voting System</title>
</head>


<body class="password-reset-page">

    <main class="auth-shell">

        <section
            class="auth-card"
            aria-labelledby="password-reset-title"
        >

            <!-- Logo -->

            <div class="logo" aria-hidden="true">

                <svg
                    class="logo-icon"
                    viewBox="0 0 48 48"
                    role="img"
                    focusable="false"
                >

                    <rect
                        x="10"
                        y="6"
                        width="28"
                        height="36"
                        rx="4"
                    ></rect>

                    <path d="M16 14h16M16 21h16M16 28h8"></path>

                    <path d="m28 30 3 3 6-7"></path>

                </svg>

            </div>


            <!-- Heading -->

            <h1 id="password-reset-title">
                Forgot Your Password?
            </h1>

            <p class="subtitle">
                Enter the email address associated with your voting account.
            </p>


            <!-- Password Reset Form -->

            <form method="POST">

                {% csrf_token %}


                <label for="email">
                    Email Address
                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >


                <button type="submit">
                    Send Reset Link
                </button>

            </form>


            <!-- Back to Login -->

            <p class="register-link">

                <a href="{% url 'login' %}">
                    Back to Login
                </a>

            </p>

        </section>

    </main>


    <!-- Theme JavaScript -->

    <script src="{% static 'voting/js/auth_sidebar.js' %}"></script>

</body>

</html>
