<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="stylesheet" href="{% static 'voting/css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'voting/css/style.css' %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,
    body {
      min-height: 100%;
    }

    body.register-page {
      min-height: 100vh;
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
      align-items: center;
      background-color: var(--color-bg);
      background-attachment: fixed;
    }

    body.register-page .auth-shell {
      margin-top: 25px;
      margin-bottom: 25px;
    }
  </style>
  <title>Register | Online Voting System</title>
</head>

<body class="register-page">
  <main class="auth-shell">
    <section class="register-card" aria-labelledby="register-title">
      <div class="logo" aria-hidden="true">
        <svg class="logo-icon" viewBox="0 0 48 48" role="img" focusable="false">
          <rect x="10" y="6" width="28" height="36" rx="4"></rect>
          <path d="M16 14h16M16 21h16M16 28h8"></path>
          <path d="m28 30 3 3 6-7"></path>
        </svg>
      </div>

      <h1 id="register-title">Create Account</h1>

      <p class="subtitle">
        Register to participate in online elections
      </p>

      <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
          Create Account
        </button>
      </form>

      <p class="login-link">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
      </p>
    </section>
  </main>
</body>

</html>
