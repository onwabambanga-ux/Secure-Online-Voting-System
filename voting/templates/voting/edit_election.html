<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="stylesheet" href="{% static 'voting/css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'voting/css/style.css' %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Edit Election | Secure Online Voting System</title>
</head>

<body class="edit-election-page auth-sidebar-page">
  {% include 'partials/auth_sidebar.html' %}
  <header class="navbar edit-election-navbar">
    <a class="brand" href="{% url 'admin_dashboard' %}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="img" focusable="false">
          <rect x="10" y="6" width="28" height="36" rx="4"></rect>
          <path d="M16 14h16M16 21h16M16 28h8"></path>
          <path d="m28 30 3 3 6-7"></path>
        </svg>
      </span>
      <span>Secure Online Voting</span>
    </a>

    <nav class="navbar-right" aria-label="Election navigation">
      <a href="{% url 'manage_elections' %}" class="back-link">Back to Elections</a>
      <a href="{% url 'admin_dashboard' %}" class="back-link">Admin Dashboard</a>
    </nav>
  </header>

  <main class="container edit-election-container">
    <section class="form-card" aria-labelledby="edit-election-title">
      <div class="form-intro">
        <span class="title-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false">
            <path d="m14 5 5 5"></path>
            <path d="M4 20h4l10.5-10.5a2.12 2.12 0 0 0-3-3L5 17v3Z"></path>
          </svg>
        </span>
        <div>
          <p class="eyebrow">Election management</p>
          <h1 id="edit-election-title">Edit Election</h1>
          <p class="subtitle">Update the election details below.</p>
        </div>

      </div>

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label for="title">Election Title</label>
          <input type="text" id="title" name="title" value="{{ election.title }}" required>

    </div>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" required>{{ election.description }}</textarea>
        </div>

        <div class="form-group">
          <label for="election_type">Election Type</label>
          <select id="election_type" name="election_type" required>
            <option value="NORMAL" {% if election.election_type == 'NORMAL' %}selected{% endif %}>Normal Election</option>
            <option value="RUNOFF" {% if election.election_type == 'RUNOFF' %}selected{% endif %}>Runoff</option>
          </select>
        </div>

        <div class="form-group">
          <label for="campus">Campus (optional)</label>
          <input type="text" id="campus" name="campus" value="{{ election.campus|default:'' }}">
        </div>

        <div class="form-group">
          <label for="start_date">Start Date and Time</label>
          <input type="datetime-local" id="start_date" name="start_date" value="{{ election.start_date|date:'Y-m-d\\TH:i' }}" required>
        </div>

        <div class="form-group">
          <label for="end_date">End Date and Time</label>
          <input type="datetime-local" id="end_date" name="end_date" value="{{ election.end_date|date:'Y-m-d\\TH:i' }}" required>
        </div>

        <div class="form-group">
          <label for="status">Election Status</label>
          <select id="status" name="status" required>
            <option value="DRAFT" {% if election.status == 'DRAFT' %}selected{% endif %}>Draft</option>
            <option value="SCHEDULED" {% if election.status == 'SCHEDULED' %}selected{% endif %}>Scheduled</option>
            <option value="OPEN" {% if election.status == 'OPEN' %}selected{% endif %}>Open</option>
            <option value="CLOSED" {% if election.status == 'CLOSED' %}selected{% endif %}>Closed</option>
            <option value="RESULTS" {% if election.status == 'RESULTS' %}selected{% endif %}>Results</option>
          </select>
        </div>

        <div class="buttons">
          <button type="submit" class="button submit-button">Save Changes</button>
          <a href="{% url 'manage_elections' %}" class="button cancel-button">Cancel</a>
        </div>
      </form>
    </section>
  </main>
<script src="{% static 'voting/js/auth_sidebar.js' %}"></script>
</body>

</html>
